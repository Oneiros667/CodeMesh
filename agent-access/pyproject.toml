[project]
name = "codemesh-agent-access"
version = "0.1.0"
description = "REST and MCP read access to local CodeMesh intelligence."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "neo4j>=5.25",
  "pymongo>=4.10",
  "mcp>=1.28.1,<2"
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.15,<0.16"
]

[project.scripts]
codemesh-agent-access = "codemesh_agent_access.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
